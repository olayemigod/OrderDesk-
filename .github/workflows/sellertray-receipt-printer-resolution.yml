name: SellerTray Receipt Printer Resolution

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - scripts/fix-sellertray-receipt-printer-resolution.mjs
      - .github/workflows/sellertray-receipt-printer-resolution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 0
      - name: Apply receipt printer correction
        run: node scripts/fix-sellertray-receipt-printer-resolution.mjs
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/redesign/OrdersWorkspace.tsx
          git commit -m "Fix governed order receipt printer resolution"
          git push origin HEAD:feat/sellertray-brand-ui-v1
