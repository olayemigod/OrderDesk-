name: One-time Atomic AI Budget Wire

on:
  push:
    branches:
      - feat/sellertray-merchant-web-v1
    paths:
      - .github/workflows/ai-budget-wire-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-merchant-web-v1
          fetch-depth: 0
      - name: Wire atomic AI provider reservation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/ai-brief/index.ts')
          text = path.read_text()

          old_type = """type ProviderUsage = {\n  model: string;\n  inputTokens: number | null;\n  cachedInputTokens: number | null;\n  outputTokens: number | null;\n  reasoningTokens: number | null;\n  totalTokens: number | null;\n};\n"""
          new_type = old_type + """\ntype ProviderReservation = {\n  allowed: boolean;\n  replayed: boolean;\n  reason: string | null;\n  dailyLimit: number;\n  providerCallsToday: number;\n  remainingProviderCalls: number;\n};\n"""
          if text.count(old_type) != 1:
              raise SystemExit(f'Expected one ProviderUsage block, found {text.count(old_type)}')
          text = text.replace(old_type, new_type)

          old_gate = """  if (providerCallsToday >= DAILY_LIMIT) {\n    const fallback = deterministicBrief(context, question);\n    await recordAttempt({\n      tenantId, userId, requestId, days, questionPresent: Boolean(question), outcome: 'daily_budget_fallback',\n      providerCalled: false, providerStatus: null, usage: null, contextBytes, fingerprint, durationMs: 0,\n    });\n    return reply(resultPayload(requestId, days, fallback, 'deterministic', budget, 'Daily AI generation budget reached. Verified metrics are shown instead.'), 200);\n  }\n\n  const started = Date.now();\n"""
          new_gate = """  let reservation: ProviderReservation;\n  try {\n    reservation = await reserveProviderCall(tenantId, requestId);\n  } catch (error) {\n    console.error('AI Brief budget reservation failed', error);\n    const fallback = deterministicBrief(context, question);\n    await recordAttempt({\n      tenantId, userId, requestId, days, questionPresent: Boolean(question), outcome: 'daily_budget_fallback',\n      providerCalled: false, providerStatus: null, usage: null, contextBytes, fingerprint, durationMs: 0,\n    });\n    return reply(resultPayload(\n      requestId, days, fallback, 'deterministic', budget,\n      'AI budget control was unavailable. SellerTray did not call the AI provider and returned verified metrics instead.',\n    ), 200);\n  }\n\n  const reservedBudget = {\n    dailyLimit: reservation.dailyLimit,\n    providerCallsToday: reservation.providerCallsToday,\n    remainingProviderCalls: reservation.remainingProviderCalls,\n  };\n\n  if (!reservation.allowed) {\n    const fallback = deterministicBrief(context, question);\n    if (!reservation.replayed) {\n      await recordAttempt({\n        tenantId, userId, requestId, days, questionPresent: Boolean(question), outcome: 'daily_budget_fallback',\n        providerCalled: false, providerStatus: null, usage: null, contextBytes, fingerprint, durationMs: 0,\n      });\n    }\n    return reply(resultPayload(\n      requestId,\n      days,\n      fallback,\n      'deterministic',\n      reservedBudget,\n      reservation.replayed\n        ? 'This AI request was already reserved. SellerTray did not call the provider again and returned verified metrics instead.'\n        : 'Daily AI generation budget reached. Verified metrics are shown instead.',\n    ), 200);\n  }\n\n  const started = Date.now();\n"""
          if text.count(old_gate) != 1:
              raise SystemExit(f'Expected one budget gate block, found {text.count(old_gate)}')
          text = text.replace(old_gate, new_gate)

          old_success_budget = """      { ...budget, providerCallsToday: providerCallsToday + 1, remainingProviderCalls: Math.max(0, DAILY_LIMIT - providerCallsToday - 1) },"""
          if text.count(old_success_budget) != 2:
              raise SystemExit(f'Expected two provider result budget blocks, found {text.count(old_success_budget)}')
          text = text.replace(old_success_budget, "      reservedBudget,")

          old_counter = """async function countProviderCallsToday(tenantId: string): Promise<number> {\n  const start = new Date();\n  start.setUTCHours(0, 0, 0, 0);\n  const rows = await serviceRest<Array<{ id: string }>>(\n    `/rest/v1/sellertray_ai_brief_attempts?select=id&tenant_id=eq.${encodeURIComponent(tenantId)}` +\n      `&provider_called=eq.true&created_at=gte.${encodeURIComponent(start.toISOString())}&limit=${DAILY_LIMIT + 1}`,\n  );\n  return rows.length;\n}\n"""
          new_counter = """async function countProviderCallsToday(tenantId: string): Promise<number> {\n  const day = new Date().toISOString().slice(0, 10);\n  const rows = await serviceRest<Array<{ id: string }>>(\n    `/rest/v1/sellertray_ai_brief_provider_reservations?select=id&tenant_id=eq.${encodeURIComponent(tenantId)}` +\n      `&reserved_on=eq.${encodeURIComponent(day)}&limit=${DAILY_LIMIT + 1}`,\n  );\n  return rows.length;\n}\n\nasync function reserveProviderCall(tenantId: string, requestId: string): Promise<ProviderReservation> {\n  const raw = await serviceRpc<J>('reserve_sellertray_ai_brief_provider_call', {\n    p_tenant_id: tenantId,\n    p_request_id: requestId,\n    p_daily_limit: DAILY_LIMIT,\n  });\n  return {\n    allowed: raw.allowed === true,\n    replayed: raw.replayed === true,\n    reason: typeof raw.reason === 'string' ? raw.reason : null,\n    dailyLimit: Math.max(1, Math.trunc(finite(raw.dailyLimit)) || DAILY_LIMIT),\n    providerCallsToday: Math.max(0, Math.trunc(finite(raw.providerCallsToday))),\n    remainingProviderCalls: Math.max(0, Math.trunc(finite(raw.remainingProviderCalls))),\n  };\n}\n"""
          if text.count(old_counter) != 1:
              raise SystemExit(f'Expected one provider count helper, found {text.count(old_counter)}')
          text = text.replace(old_counter, new_counter)

          path.write_text(text)
          PY

          rm .github/workflows/ai-budget-wire-once.yml
          git config user.name "sellertray-automation"
          git config user.email "sellertray-automation@users.noreply.github.com"
          git add supabase/functions/ai-brief/index.ts .github/workflows/ai-budget-wire-once.yml
          git diff --cached --check
          git commit -m "Enforce atomic AI Brief provider budget"
          git push origin HEAD:feat/sellertray-merchant-web-v1
