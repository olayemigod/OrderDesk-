name: SellerTray product scan patch

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - scripts/patch-sellertray-product-scan.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Patch mobile product scan
        run: python3 scripts/patch-sellertray-product-scan.py
      - name: Install camera dependency
        working-directory: apps/mobile
        run: npx expo install expo-camera --npm
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          rm scripts/patch-sellertray-product-scan.py
          rm .github/workflows/run-sellertray-product-scan-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile scripts/patch-sellertray-product-scan.py .github/workflows/run-sellertray-product-scan-patch.yml
          git commit -m 'feat: enable mobile product barcode capture'
          git push origin HEAD:feat/sellertray-brand-ui-v1
