name: SellerTray product scan repair

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - scripts/patch-sellertray-product-scan.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Repair product scan integration
        run: python3 scripts/patch-sellertray-product-scan.py
      - name: Install SDK-compatible camera dependency
        working-directory: apps/mobile
        run: npx expo install expo-camera --npm
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Release preflight
        working-directory: apps/mobile
        run: npm run release:preflight
      - name: Validate diff
        run: git diff --check
      - name: Commit repaired checkpoint
        run: |
          rm scripts/patch-sellertray-product-scan.py
          rm .github/workflows/run-sellertray-product-scan-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile supabase/tests scripts/patch-sellertray-product-scan.py .github/workflows/run-sellertray-product-scan-patch.yml
          git commit -m 'fix: complete SellerTray product scan integration'
          git push origin HEAD:feat/sellertray-brand-ui-v1