name: One-shot Supabase deploy credential check

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - .github/workflows/check-supabase-deploy-credential.yml

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
      - name: Check credential presence without exposing it
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_DEPLOY_CREDENTIAL=available" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SUPABASE_DEPLOY_CREDENTIAL=not_configured" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/check-supabase-deploy-credential.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/check-supabase-deploy-credential.yml
          git commit -m 'chore: remove Supabase credential check workflow'
          git push origin HEAD:feat/sellertray-brand-ui-v1
