name: SellerTray Build 24 Marker Fix

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - 'scripts/fix-sellertray-build24-marker.mjs'
      - '.github/workflows/sellertray-build24-marker-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SellerTray QA branch
        uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 0

      - name: Update Build 24 diagnostic marker
        run: node scripts/fix-sellertray-build24-marker.mjs

      - name: Commit marker fix
        run: |
          if git diff --quiet; then
            echo "No marker change produced" >&2
            exit 1
          fi
          git config user.name "sellertray-qa-bot"
          git config user.email "sellertray-qa-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fix SellerTray Build 24 marker"
          git push origin HEAD:feat/sellertray-brand-ui-v1
