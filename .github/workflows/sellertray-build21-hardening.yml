name: SellerTray Build 21 Hardening

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - .github/workflows/sellertray-build21-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Apply bounded cash and shift hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          repo = Path('.')
          cash_repo = repo / 'apps/mobile/src/data/cashShiftRepository.ts'
          cash_ui = repo / 'apps/mobile/src/redesign/CashShiftWorkspace.tsx'
          app_json = repo / 'apps/mobile/app.json'
          more_ui = repo / 'apps/mobile/src/redesign/MoreWorkspace.tsx'
          runner = repo / 'apps/mobile/scripts/release-preflight-runner.mjs'

          replace_once(cash_repo,
          "export async function loadActiveCashShift(\n",
          "export async function loadCashWriteAccess(tenantId: string): Promise<boolean> {\n  if (!tenantId) return false;\n  const { data, error } = await supabase.rpc('orderdesk_subscription_can_write', {\n    p_tenant_id: tenantId,\n  });\n  if (error) throw error;\n  return data === true;\n}\n\nexport async function loadActiveCashShift(\n")

          replace_once(cash_ui,
          "  loadCashShiftCapabilities,\n  openCashShift,",
          "  loadCashShiftCapabilities,\n  loadCashWriteAccess,\n  openCashShift,")

          replace_once(cash_ui,
          "  const [capabilities, setCapabilities] = useState<CashShiftCapabilities>(NO_CAPABILITIES);\n  const [shift, setShift] = useState<CashShift | null>(null);",
          "  const [capabilities, setCapabilities] = useState<CashShiftCapabilities>(NO_CAPABILITIES);\n  const [capabilitiesLoaded, setCapabilitiesLoaded] = useState(false);\n  const [canWrite, setCanWrite] = useState<boolean | null>(null);\n  const [shift, setShift] = useState<CashShift | null>(null);")

          old_refresh = '''  async function refresh(options?: { quiet?: boolean }) {
    if (!options?.quiet) setLoading(true);
    setError(null);
    try {
      const [nextRegisters, nextCapabilities, nextShift, nextHistory] = await Promise.all([
        loadCashRegisters(tenantId, branch.id),
        loadCashShiftCapabilities(tenantId, branch.id),
        loadActiveCashShift(tenantId, branch.id),
        loadCashShiftHistory(tenantId, branch.id, 30),
      ]);
      setRegisters(nextRegisters);
      setCapabilities(nextCapabilities);
      setShift(nextShift);
      setHistory(nextHistory);
      setSelectedRegisterId((current) => {
        if (nextRegisters.some((entry) => entry.id === current)) return current;
        return nextRegisters.find((entry) => entry.isDefault)?.id ?? nextRegisters[0]?.id ?? '';
      });
      onShiftChanged?.(nextShift);
    } catch (err) {
      setError(err instanceof Error ? err.message : 'Unable to load cash and shift information.');
    } finally {
      if (!options?.quiet) setLoading(false);
    }
  }
'''
          new_refresh = '''  async function refresh(options?: { quiet?: boolean }) {
    if (!options?.quiet) setLoading(true);
    setError(null);
    const results = await Promise.allSettled([
      loadCashRegisters(tenantId, branch.id),
      loadCashShiftCapabilities(tenantId, branch.id),
      loadCashWriteAccess(tenantId),
      loadActiveCashShift(tenantId, branch.id),
      loadCashShiftHistory(tenantId, branch.id, 30),
    ]);
    const [registerResult, capabilityResult, writeResult, shiftResult, historyResult] = results;
    const errors: string[] = [];

    if (registerResult.status === 'fulfilled') {
      setRegisters(registerResult.value);
      setSelectedRegisterId((current) => {
        if (registerResult.value.some((entry) => entry.id === current)) return current;
        return registerResult.value.find((entry) => entry.isDefault)?.id ?? registerResult.value[0]?.id ?? '';
      });
    } else {
      setRegisters([]);
      setSelectedRegisterId('');
      errors.push('Unable to refresh registers.');
    }

    if (capabilityResult.status === 'fulfilled') {
      setCapabilities(capabilityResult.value);
      setCapabilitiesLoaded(true);
    } else {
      setCapabilities(NO_CAPABILITIES);
      setCapabilitiesLoaded(false);
      errors.push('Unable to confirm cashier permissions.');
    }

    if (writeResult.status === 'fulfilled') {
      setCanWrite(writeResult.value);
    } else {
      setCanWrite(null);
      errors.push('Unable to confirm whether cash actions are available.');
    }

    if (shiftResult.status === 'fulfilled') {
      setShift(shiftResult.value);
      onShiftChanged?.(shiftResult.value);
    } else {
      setShift(null);
      errors.push('Unable to refresh the current cashier shift.');
    }

    if (historyResult.status === 'fulfilled') {
      setHistory(historyResult.value);
    } else {
      setHistory([]);
      errors.push('Unable to refresh cashier history.');
    }

    if (errors.length > 0) setError(errors.join(' '));
    if (!options?.quiet) setLoading(false);
  }
'''
          replace_once(cash_ui, old_refresh, new_refresh)

          replace_once(cash_ui,
          "    setShift(null);\n    setHistory([]);",
          "    setShift(null);\n    setHistory([]);\n    setCapabilities(NO_CAPABILITIES);\n    setCapabilitiesLoaded(false);\n    setCanWrite(null);")

          replace_once(cash_ui,
          "  async function handleOpenShift() {\n    if (saving) return;\n    const amount = Number(openingCash);",
          "  async function handleOpenShift() {\n    if (saving) return;\n    if (canWrite !== true) {\n      setError(canWrite === false\n        ? 'This business is read-only. Reactivate the subscription to open a cashier shift.'\n        : 'SellerTray could not confirm whether cash actions are available. Refresh and try again.');\n      return;\n    }\n    const amount = parseCashInput(openingCash);")

          replace_once(cash_ui,
          "    if (openingCash.trim() === '' || !Number.isFinite(amount) || amount < 0) {",
          "    if (amount === null || amount < 0) {")

          replace_once(cash_ui,
          "  async function handleMovement() {\n    if (!shift || !movementMode || saving) return;",
          "  async function handleMovement() {\n    if (!shift || !movementMode || saving) return;\n    if (canWrite !== true) {\n      setError('This business is read-only. Reactivate the subscription before recording cash activity.');\n      return;\n    }")

          replace_once(cash_ui,
          "  async function handleCloseShift() {\n    if (!shift || saving) return;",
          "  async function handleCloseShift() {\n    if (!shift || saving) return;\n    if (canWrite !== true) {\n      setError('This business is read-only. Reactivate the subscription before closing this shift.');\n      return;\n    }")

          replace_once(cash_ui,
          "  async function handleReview() {\n    if (!reviewShift || saving) return;",
          "  async function handleReview() {\n    if (!reviewShift || saving) return;\n    if (canWrite !== true) {\n      setError('This business is read-only. Reactivate the subscription before saving a shift review.');\n      return;\n    }")

          replace_once(cash_ui,
          "        {error ? <MessageCard text={error} error dark={dark} /> : null}\n        <View style={styles.metricGrid}>",
          "        {error ? <MessageCard text={error} error dark={dark} /> : null}\n        {canWrite === false ? <MessageCard text=\"This business is read-only. Shift details remain available, but review decisions cannot be saved until the subscription is reactivated.\" error dark={dark} /> : null}\n        <View style={styles.metricGrid}>")

          replace_once(cash_ui,
          "          <PrimaryButton label=\"Save review\" loading={saving} onPress={() => void handleReview()} />",
          "          <PrimaryButton label=\"Save review\" loading={saving} disabled={canWrite !== true} onPress={() => void handleReview()} />")

          replace_once(cash_ui,
          "      {error ? <MessageCard text={error} error dark={dark} /> : null}\n      {notice ? <MessageCard text={notice} dark={dark} /> : null}",
          "      {error ? <MessageCard text={error} error dark={dark} /> : null}\n      {canWrite === false ? <MessageCard text=\"This business is read-only. You can review cashier information, but cash actions are unavailable until the subscription is reactivated.\" error dark={dark} /> : null}\n      {notice ? <MessageCard text={notice} dark={dark} /> : null}")

          replace_once(cash_ui,
          "          {!capabilities.canOpenShift ? (\n            <Text style={[styles.helper, dark && darkStyles.bodyText]}>You do not have permission to open a cashier shift.</Text>\n          ) : registers.length === 0 ? (",
          "          {canWrite === false ? (\n            <Text style={[styles.helper, dark && darkStyles.bodyText]}>Cashier actions are unavailable while this business is read-only. Reactivate the subscription to continue.</Text>\n          ) : canWrite === null ? (\n            <Text style={[styles.helper, dark && darkStyles.bodyText]}>SellerTray could not confirm whether cash actions are available. Refresh and try again.</Text>\n          ) : !capabilitiesLoaded ? (\n            <Text style={[styles.helper, dark && darkStyles.bodyText]}>Cashier permissions could not be confirmed. Refresh and try again.</Text>\n          ) : !capabilities.canOpenShift ? (\n            <Text style={[styles.helper, dark && darkStyles.bodyText]}>You do not have permission to open a cashier shift.</Text>\n          ) : registers.length === 0 ? (")

          replace_once(cash_ui,
          "                onChangeText={setOpeningCash}\n                keyboardType=\"decimal-pad\"",
          "                onChangeText={setOpeningCash}\n                onEndEditing={() => setOpeningCash(normalizeCashInput(openingCash))}\n                keyboardType=\"decimal-pad\"")

          replace_once(cash_ui,
          "          {movementMode ? (",
          "          {canWrite !== true ? (\n            <View style={[styles.infoCard, dark && darkStyles.subtleCard]}>\n              <Text style={[styles.infoTitle, dark && darkStyles.titleText]}>Cash actions unavailable</Text>\n              <Text style={[styles.infoText, dark && darkStyles.bodyText]}>Reactivate the subscription before recording expenses, cash in, cash out or closing this shift.</Text>\n            </View>\n          ) : movementMode ? (")

          replace_once(cash_ui,
          "          {closeMode ? (",
          "          {canWrite === true && closeMode ? (")

          replace_once(cash_ui,
          "function PrimaryButton({ label, loading, onPress, compact = false }: { label: string; loading?: boolean; onPress: () => void; compact?: boolean }) {\n  return (\n    <Pressable disabled={loading} onPress={onPress} style={({ pressed }) => [styles.primaryButton, compact && styles.flexButton, pressed && styles.pressed, loading && styles.disabled]}>",
          "function PrimaryButton({ label, loading, disabled = false, onPress, compact = false }: { label: string; loading?: boolean; disabled?: boolean; onPress: () => void; compact?: boolean }) {\n  const unavailable = loading || disabled;\n  return (\n    <Pressable disabled={unavailable} onPress={onPress} style={({ pressed }) => [styles.primaryButton, compact && styles.flexButton, pressed && !unavailable && styles.pressed, unavailable && styles.disabled]}>")

          replace_once(cash_ui,
          "function formatQuantity(value: number): string {\n  return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));\n}\n",
          "function formatQuantity(value: number): string {\n  return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));\n}\n\nfunction parseCashInput(value: string): number | null {\n  const normalized = value.replace(/,/g, '').trim();\n  if (!normalized || !/^\\d+(?:\\.\\d{0,2})?$/.test(normalized)) return null;\n  const amount = Number(normalized);\n  return Number.isFinite(amount) ? amount : null;\n}\n\nfunction normalizeCashInput(value: string): string {\n  const amount = parseCashInput(value);\n  if (amount === null) return value.trim();\n  return new Intl.NumberFormat('en-NG', { maximumFractionDigits: 2 }).format(amount);\n}\n")

          replace_once(app_json, '"versionCode": 20', '"versionCode": 21')
          replace_once(more_ui, 'SellerTray 1.0.0 · Android build 20', 'SellerTray 1.0.0 · Android build 21')
          replace_once(runner,
          "const currentVersionCodeCheck = \"requireValue(app.android?.versionCode === 20, 'Android versionCode must be 20 for the merchant-reference QA line');\";",
          "const currentVersionCodeCheck = \"requireValue(app.android?.versionCode === 21, 'Android versionCode must be 21 for the merchant-reference QA line');\";")
          PY

      - name: Check diff
        run: git diff --check

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run SellerTray release preflight
        working-directory: apps/mobile
        run: npm run preflight

      - name: Commit build 21 hardening and remove one-shot workflow
        run: |
          rm .github/workflows/sellertray-build21-hardening.yml
          git config user.name "SellerTray QA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/src/data/cashShiftRepository.ts \
                  apps/mobile/src/redesign/CashShiftWorkspace.tsx \
                  apps/mobile/src/redesign/MoreWorkspace.tsx \
                  apps/mobile/scripts/release-preflight-runner.mjs \
                  apps/mobile/app.json \
                  .github/workflows/sellertray-build21-hardening.yml
          git diff --cached --check
          git commit -m "fix: harden read-only cash shift UX"
          git push origin HEAD:feat/sellertray-brand-ui-v1
