name: One-time SellerTray Type Repair

on:
  push:
    branches:
      - feat/sellertray-mobile-shell-v2
    paths:
      - '.github/workflows/one-time-sellertray-type-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-mobile-shell-v2
          fetch-depth: 0

      - name: Apply exact type repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/mobile/src/SaasApp.tsx')
          text = path.read_text()

          old_props = '''}: {\n  orders: MerchantOrder[];\n  currency: string;\n  unreadByCustomer: Map<string, { unreadCount: number; latestReceivedAt: string | null }>;'''
          new_props = '''}: {\n  tenantId: string;\n  orders: MerchantOrder[];\n  currency: string;\n  unreadByCustomer: Map<string, { unreadCount: number; latestReceivedAt: string | null }>;'''
          if text.count(old_props) != 1:
              raise SystemExit(f'Expected exactly one ConversationsView props marker, found {text.count(old_props)}')
          text = text.replace(old_props, new_props, 1)

          old_style = "  primaryButtonText: { color: '#FFFFFF', fontWeight: '900' },\n});"
          new_style = "  primaryButtonText: { color: '#FFFFFF', fontWeight: '900' },\n  disabled: { opacity: 0.45 },\n});"
          if text.count(old_style) != 1:
              raise SystemExit(f'Expected exactly one SaasApp style marker, found {text.count(old_style)}')
          text = text.replace(old_style, new_style, 1)

          path.write_text(text)

      - name: Commit repair
        run: |
          git config user.name "SellerTray CI Repair"
          git config user.email "sellertray-ci@users.noreply.github.com"
          git add apps/mobile/src/SaasApp.tsx
          git diff --cached --check
          git commit -m "Fix legacy SellerTray workspace typing"
          git push origin HEAD:feat/sellertray-mobile-shell-v2
