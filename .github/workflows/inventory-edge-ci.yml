name: Inventory Edge CI

on:
  pull_request:
    paths:
      - 'supabase/functions/inventory-operation/**'
      - '.github/workflows/inventory-edge-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/inventory-operation/**'
      - '.github/workflows/inventory-edge-ci.yml'

permissions:
  contents: read

concurrency:
  group: inventory-edge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck inventory Edge handler
        run: deno check supabase/functions/inventory-operation/index.ts
      - name: Test verified-cost payload parsing without network or secrets
        run: deno test supabase/functions/inventory-operation/adjustment-cost.test.ts
