name: SellerTray Device QA Hotfix Apply

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - 'scripts/apply-sellertray-device-qa-hotfix.mjs'
      - '.github/workflows/sellertray-device-qa-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 0
      - name: Apply exact SellerTray device QA patch
        run: node scripts/apply-sellertray-device-qa-hotfix.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes produced" >&2
            exit 1
          fi
          git config user.name "sellertray-qa-bot"
          git config user.email "sellertray-qa-bot@users.noreply.github.com"
          git add apps/mobile/src/redesign/SellWorkspace.tsx
          git commit -m "Fix SellerTray barcode and offline POS runtime"
          git push origin HEAD:feat/sellertray-brand-ui-v1
