name: One-time wire POS idempotency

on:
  push:
    branches:
      - feat/sellertray-merchant-web-v1
    paths:
      - .github/workflows/one-time-wire-pos-idempotency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-merchant-web-v1
          fetch-depth: 0
      - name: Wire request identity through Edge and mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          edge = Path('supabase/functions/merchant-order/index.ts')
          replace_once(
              edge,
              "  const note = cleanText(body.note, 500);\n\n  if (!tenantId)",
              "  const note = cleanText(body.note, 500);\n  const requestId = cleanUuid(body.requestId);\n\n  if (!tenantId)",
          )
          replace_once(
              edge,
              """    const { data: orderId, error: createError } = await admin.rpc('create_sellertray_pos_order_atomic', {
      p_tenant_id: tenantId,
      p_branch_id: branchId,
      p_customer_name: customerName,
      p_customer_phone: customerPhone,
      p_note: note,
      p_items: lines.map((line) => ({
        catalog_item_id: line.catalogItemId,
        uom_id: line.uomId,
        quantity: line.quantity,
      })),
    });

    if (createError || typeof orderId !== 'string') {
      return json({ error: createError?.message ?? 'Unable to create sale' }, 400);
    }
""",
              """    const rpcItems = lines.map((line) => ({
      catalog_item_id: line.catalogItemId,
      uom_id: line.uomId,
      quantity: line.quantity,
    }));
    let orderId: string | null = null;
    let idempotentReplay = false;
    let createErrorMessage: string | null = null;

    if (requestId) {
      const { data: createResult, error: createError } = await admin.rpc('create_sellertray_pos_order_idempotent', {
        p_tenant_id: tenantId,
        p_branch_id: branchId,
        p_customer_name: customerName,
        p_customer_phone: customerPhone,
        p_note: note,
        p_items: rpcItems,
        p_request_id: requestId,
      });
      if (createError) createErrorMessage = createError.message;
      if (createResult && typeof createResult === 'object' && !Array.isArray(createResult)) {
        const row = createResult as JsonRecord;
        if (typeof row.orderId === 'string') orderId = row.orderId;
        idempotentReplay = row.idempotentReplay === true;
      }
    } else {
      const { data: createdOrderId, error: createError } = await admin.rpc('create_sellertray_pos_order_atomic', {
        p_tenant_id: tenantId,
        p_branch_id: branchId,
        p_customer_name: customerName,
        p_customer_phone: customerPhone,
        p_note: note,
        p_items: rpcItems,
      });
      if (createError) createErrorMessage = createError.message;
      if (typeof createdOrderId === 'string') orderId = createdOrderId;
    }

    if (createErrorMessage || !orderId) {
      const message = createErrorMessage ?? 'Unable to create sale';
      return json({ error: message }, /already used for different sale details/i.test(message) ? 409 : 400);
    }
""",
          )
          replace_once(
              edge,
              "      metadata: { source: 'pos', branch_id: branchId },",
              "      metadata: { source: 'pos', branch_id: branchId, request_id: requestId, idempotent_replay: idempotentReplay },",
          )
          replace_once(
              edge,
              "    return json({ orderId, status: 'draft', source: 'pos' }, 201);",
              "    return json({ orderId, status: 'draft', source: 'pos', idempotentReplay }, idempotentReplay ? 200 : 201);",
          )

          commerce = Path('apps/mobile/src/data/commerceRepository.ts')
          replace_once(
              commerce,
              "  note?: string | null;\n  items: PosDraftLine[];",
              "  note?: string | null;\n  requestId?: string | null;\n  items: PosDraftLine[];",
          )
          replace_once(
              commerce,
              "      note: cleanOptional(input.note),\n      items: input.items.map((item) => ({",
              "      note: cleanOptional(input.note),\n      requestId: input.requestId ?? createSellerTrayRequestId(),\n      items: input.items.map((item) => ({",
          )
          replace_once(
              commerce,
              "function cleanOptional(value: string | null | undefined): string | null {",
              """export function createSellerTrayRequestId(): string {
  const runtimeCrypto = (globalThis as typeof globalThis & {
    crypto?: {
      randomUUID?: () => string;
      getRandomValues?: (array: Uint8Array) => Uint8Array;
    };
  }).crypto;
  const generated = runtimeCrypto?.randomUUID?.();
  if (generated && /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(generated)) {
    return generated;
  }

  const bytes = new Uint8Array(16);
  if (runtimeCrypto?.getRandomValues) {
    runtimeCrypto.getRandomValues(bytes);
  } else {
    for (let index = 0; index < bytes.length; index += 1) bytes[index] = Math.floor(Math.random() * 256);
  }
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, (value) => value.toString(16).padStart(2, '0')).join('');
  return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
}

function cleanOptional(value: string | null | undefined): string | null {""",
          )

          sell = Path('apps/mobile/src/redesign/SellWorkspace.tsx')
          replace_once(
              sell,
              "  createPosDraft,\n  type CommerceBranch,",
              "  createPosDraft,\n  createSellerTrayRequestId,\n  type CommerceBranch,",
          )
          replace_once(
              sell,
              "  const [draftOrderId, setDraftOrderId] = useState<string | null>(null);\n  const [checkoutError, setCheckoutError]",
              "  const [draftOrderId, setDraftOrderId] = useState<string | null>(null);\n  const [draftRequestId, setDraftRequestId] = useState<string | null>(null);\n  const [checkoutError, setCheckoutError]",
          )
          replace_once(
              sell,
              "    setCart({});\n    setDraftOrderId(null);\n    setCheckoutError(null);",
              "    setCart({});\n    setDraftOrderId(null);\n    setDraftRequestId(null);\n    setCheckoutError(null);",
          )
          replace_once(
              sell,
              "    const key = `${product.id}:${uom.id}`;\n    setCheckoutError(null);\n    setCart((current) => {",
              "    const key = `${product.id}:${uom.id}`;\n    setCheckoutError(null);\n    setDraftRequestId(null);\n    setCart((current) => {",
          )
          replace_once(
              sell,
              "    if (checkoutLocked || !stockReady) return;\n    setCheckoutError(null);\n    const step = line.uom.allowFractional ? 0.5 : 1;",
              "    if (checkoutLocked || !stockReady) return;\n    setCheckoutError(null);\n    setDraftRequestId(null);\n    const step = line.uom.allowFractional ? 0.5 : 1;",
          )
          replace_once(
              sell,
              """      const orderId = await createPosDraft({
        tenantId,
        branchId: branch.id,
        items: cartLines.map((line) => ({""",
              """      const requestId = draftRequestId ?? createSellerTrayRequestId();
      if (!draftRequestId) setDraftRequestId(requestId);
      const orderId = await createPosDraft({
        tenantId,
        branchId: branch.id,
        requestId,
        items: cartLines.map((line) => ({""",
          )
          replace_once(
              sell,
              "      setCart({});\n      setDraftOrderId(null);\n      try {",
              "      setCart({});\n      setDraftOrderId(null);\n      setDraftRequestId(null);\n      try {",
          )
          replace_once(
              sell,
              "    setCart({});\n    setDraftOrderId(null);\n    onDraftCreated?.(orderId);",
              "    setCart({});\n    setDraftOrderId(null);\n    setDraftRequestId(null);\n    onDraftCreated?.(orderId);",
          )
          PY
      - name: Verify bounded diff
        run: |
          git diff --check
          git diff -- supabase/functions/merchant-order/index.ts apps/mobile/src/data/commerceRepository.ts apps/mobile/src/redesign/SellWorkspace.tsx
      - name: Commit runtime wiring and remove one-time workflow
        run: |
          git config user.name "sellertray-agent"
          git config user.email "sellertray-agent@users.noreply.github.com"
          git add supabase/functions/merchant-order/index.ts apps/mobile/src/data/commerceRepository.ts apps/mobile/src/redesign/SellWorkspace.tsx
          git rm .github/workflows/one-time-wire-pos-idempotency.yml
          git diff --cached --check
          git commit -m "Wire idempotent POS draft requests"
          git push origin HEAD:feat/sellertray-merchant-web-v1
