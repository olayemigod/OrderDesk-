name: Mobile Dependency Candidate

permissions:
  contents: write

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-dependency-candidate.yml'
      - 'apps/mobile/scripts/dependency-audit-policy.mjs'

jobs:
  apply-candidate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/sellertray-brand-ui-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install current locked dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Apply non-breaking audit fixes to lockfile
        working-directory: apps/mobile
        run: npm audit fix --package-lock-only --omit=dev --no-fund || true

      - name: Reinstall candidate lockfile
        working-directory: apps/mobile
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Verify dependency policy
        working-directory: apps/mobile
        run: node scripts/dependency-audit-policy.mjs

      - name: Verify TypeScript
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Commit candidate and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git rm .github/workflows/mobile-dependency-candidate.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency candidate changes to commit"
            exit 1
          fi
          git commit -m "fix: refresh mobile transitive dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
