name: Release 3 SDK58 lock refresh (source only)
on:
  push:
    branches: [fix/production-mobile-release3-20261127]
    paths: [.github/workflows/release3-sdk58-lock-refresh.yml]
permissions:
  contents: read
concurrency:
  group: release3-sdk58-lock-refresh
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare only the three observed Expo Doctor compatibility updates
        working-directory: apps/mobile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const pins = {expo:['~58.0.24','~58.1.0'],'expo-notifications':['~58.1.9','~58.1.10'],'expo-splash-screen':['~58.0.14','~58.0.15']};
          for(const [name,[old,next]] of Object.entries(pins)){
            if(p.dependencies[name]!==old) throw Error('Unexpected existing pin: '+name);
            p.dependencies[name]=next;
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const file='scripts/release-preflight.mjs';
          const source=fs.readFileSync(file,'utf8');
          const needle="pkg.dependencies?.['expo-notifications'] === '~58.1.9'";
          if(source.split(needle).length!==2) throw Error('Unexpected notification pin guard');
          fs.writeFileSync(file,source.replace(needle,"pkg.dependencies?.['expo-notifications'] === '~58.1.10'"));
          NODE
      - name: Resolve published npm graph and verify clean locked install
        working-directory: apps/mobile
        run: |
          npm --prefix . install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix . ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency boundary and current Expo compatibility
        working-directory: apps/mobile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {inspectExpoZodLock} from './scripts/expo-zod-advisory-contract.mjs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const r=inspectExpoZodLock(p,l);
          console.log(JSON.stringify(r));
          if(!r.expoVersion.startsWith('58.') || !r.cliVersion.startsWith('58.') || r.productionVulnerable.length || r.cliRequiresZod3 || r.directDependency) throw Error('Unsafe resolved dependency boundary');
          NODE
          npm run audit:dependencies
          npx --no-install expo install --check
          node --test scripts/expo-doctor-workspace-gate.test.mjs
          node scripts/expo-doctor-workspace-gate.mjs
      - name: Check scope and package integrity
        run: |
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' apps/mobile/package-lock.json apps/mobile/package.json apps/mobile/scripts/release-preflight.mjs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          mkdir -p /tmp/release3-sdk58
          cp apps/mobile/package.json apps/mobile/package-lock.json apps/mobile/scripts/release-preflight.mjs /tmp/release3-sdk58/
      - uses: actions/upload-artifact@v4
        with:
          name: release3-sdk58-verified-lock
          path: /tmp/release3-sdk58/
          retention-days: 3
  commit-source:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release3-sdk58-verified-lock
          path: /tmp/release3-sdk58
      - name: Record only verified source artifacts on the exact release branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/fix/production-mobile-release3-20261127 | cut -f1)" = "$EXPECTED_SHA"
          cp /tmp/release3-sdk58/package.json apps/mobile/package.json
          cp /tmp/release3-sdk58/package-lock.json apps/mobile/package-lock.json
          cp /tmp/release3-sdk58/release-preflight.mjs apps/mobile/scripts/release-preflight.mjs
          git add apps/mobile/package.json apps/mobile/package-lock.json apps/mobile/scripts/release-preflight.mjs
          git -c user.name=sellertray-ci -c user.email=sellertray-ci@users.noreply.github.com commit -m 'chore(mobile): resolve current SDK58 compatible lock for Release 3'
          git push origin HEAD:refs/heads/fix/production-mobile-release3-20261127
