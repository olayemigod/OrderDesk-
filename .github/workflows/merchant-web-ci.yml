name: Merchant Web CI

on:
  push:
    branches:
      - feat/sellertray-merchant-web-v1
    paths:
      - 'apps/merchant-web/**'
      - 'scripts/check-internal-authority-rpc-boundary.mjs'
      - '.github/workflows/merchant-web-ci.yml'
  pull_request:
    paths:
      - 'apps/merchant-web/**'
      - 'scripts/check-internal-authority-rpc-boundary.mjs'
      - '.github/workflows/merchant-web-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-web
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enforce internal authority RPC boundary
        run: node ../../scripts/check-internal-authority-rpc-boundary.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Security preflight
        run: npm run preflight
      - name: Production build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-web
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
