name: Mobile CI

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'docs/release_runbook.md'
      - 'docs/data_lifecycle.md'
      - 'docs/release_acceptance.json'
      - 'docs/saas_rollout_status.md'
      - 'docs/google_play_data_safety.md'
      - 'docs/google_play_submission.md'
      - 'docs/google_play_store_listing.md'
      - 'docs/data_processor_review.md'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'docs/release_runbook.md'
      - 'docs/data_lifecycle.md'
      - 'docs/release_acceptance.json'
      - 'docs/saas_rollout_status.md'
      - 'docs/google_play_data_safety.md'
      - 'docs/google_play_submission.md'
      - 'docs/google_play_store_listing.md'
      - 'docs/data_processor_review.md'
      - '.github/workflows/mobile-ci.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check committed dependency lockfile
        id: lockfile
        run: |
          if test -f package-lock.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bootstrap committed dependency lockfile
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.lockfile.outputs.present == 'false' }}
        run: |
          test -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Commit SellerTray mobile dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Typecheck
        run: npm run typecheck

      - name: SellerTray release preflight
        run: npm run preflight
