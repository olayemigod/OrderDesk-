name: SellerTray QA APK

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "SellerTray commit SHA or ref to build"
        required: true
        default: "feat/sellertray-brand-ui-v1"

permissions:
  contents: read

concurrency:
  group: sellertray-qa-apk
  cancel-in-progress: false

jobs:
  build-qa-apk:
    name: Build SellerTray QA APK on GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SELLERTRAY_MOBILE_REDESIGN: '1'
      SELLERTRAY_QA_SIGNING_CERT_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
      SELLERTRAY_ANDROID_NDK_VERSION: 27.1.12297006

    steps:
      - name: Checkout requested SellerTray revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}

      - name: Record exact source revision
        id: source
        working-directory: .
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Load governed QA runtime configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const qa = require('./eas.json').build?.qa?.env ?? {};
          const required = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'EXPO_PUBLIC_EAS_PROJECT_ID',
          ];
          const missing = required.filter((key) => !qa[key]);
          if (missing.length) {
            throw new Error(`Missing governed QA runtime configuration: ${missing.join(', ')}`);
          }
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            required.map((key) => `${key}=${qa[key]}`).join('\n') + '\n',
          );
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: SellerTray release preflight
        run: npm run preflight

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify barcode camera permission
        shell: bash
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          camera_line="$(grep 'android.permission.CAMERA' "$manifest" || true)"
          if [ -z "$camera_line" ]; then
            echo "SellerTray barcode scanner is missing android.permission.CAMERA" >&2
            exit 1
          fi
          if printf '%s\n' "$camera_line" | grep -q 'tools:node="remove"'; then
            echo "SellerTray barcode scanner CAMERA permission is marked for removal" >&2
            exit 1
          fi
          active_audio="$(grep 'android.permission.RECORD_AUDIO' "$manifest" | grep -v 'tools:node="remove"' || true)"
          if [ -n "$active_audio" ]; then
            echo "SellerTray barcode scanning must not request active RECORD_AUDIO permission" >&2
            printf '%s\n' "$active_audio" >&2
            exit 1
          fi

      - name: Verify QA signing lineage
        shell: bash
        run: |
          actual="$(keytool -exportcert -alias androiddebugkey -keystore android/app/debug.keystore -storepass android | sha256sum | awk '{print $1}')"
          if [ "$actual" != "$SELLERTRAY_QA_SIGNING_CERT_SHA256" ]; then
            echo "SellerTray QA signing certificate changed: $actual" >&2
            exit 1
          fi

      - name: Provision required Android NDK
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          ndk_dir="${ANDROID_HOME}/ndk/${SELLERTRAY_ANDROID_NDK_VERSION}"
          test -x "$sdkmanager_bin"
          if [ -f "$ndk_dir/source.properties" ]; then
            grep '^Pkg.Revision' "$ndk_dir/source.properties"
            exit 0
          fi
          rm -rf "$ndk_dir"
          for attempt in 1 2 3; do
            echo "Installing NDK attempt ${attempt}/3"
            set +e
            set +o pipefail
            yes | "$sdkmanager_bin" "ndk;${SELLERTRAY_ANDROID_NDK_VERSION}"
            sdk_status=${PIPESTATUS[1]}
            set -o pipefail
            set -e
            if [ "$sdk_status" -eq 0 ] && [ -f "$ndk_dir/source.properties" ]; then
              grep '^Pkg.Revision' "$ndk_dir/source.properties"
              exit 0
            fi
            rm -rf "$ndk_dir"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Unable to provision required Android NDK" >&2
          exit 1

      - name: Build release APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        id: apk
        shell: bash
        run: |
          source_apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$source_apk"
          short_sha="${{ steps.source.outputs.sha }}"
          short_sha="${short_sha:0:12}"
          output="SellerTray-QA-${short_sha}.apk"
          cp "$source_apk" "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          echo "name=SellerTray-QA-${short_sha}" >> "$GITHUB_OUTPUT"
          sha256sum "$output"

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: apps/mobile/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build provenance summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          echo "## SellerTray QA APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Builder: GitHub Actions native Android/Gradle" >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime config: governed QA profile injected at bundle time" >> "$GITHUB_STEP_SUMMARY"
          echo "EAS cloud build: not used" >> "$GITHUB_STEP_SUMMARY"
