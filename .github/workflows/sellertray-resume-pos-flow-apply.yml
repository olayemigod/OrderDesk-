name: SellerTray Resume POS Flow Apply

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - 'scripts/apply-sellertray-resume-pos-flow.mjs'
      - '.github/workflows/sellertray-resume-pos-flow-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Apply resumed POS workflow patch
        run: node scripts/apply-sellertray-resume-pos-flow.mjs
      - name: Mobile typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Verify diff
        run: |
          git diff --check
          git diff --exit-code -- apps/mobile/src/redesign/ResumePosDraftWorkspace.tsx apps/mobile/src/redesign/RedesignWorkspace.tsx >/dev/null && {
            echo "No patch changes produced" >&2
            exit 1
          } || true
      - name: Commit patch
        run: |
          git config user.name "sellertray-qa-bot"
          git config user.email "sellertray-qa-bot@users.noreply.github.com"
          git add apps/mobile/src/redesign/ResumePosDraftWorkspace.tsx apps/mobile/src/redesign/RedesignWorkspace.tsx
          git commit -m "Complete resumed POS Products Cart Payment flow"
          git push origin HEAD:feat/sellertray-brand-ui-v1
