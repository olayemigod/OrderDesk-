name: Admin Web CI

on:
  push:
    paths:
      - 'package.json'
      - 'apps/admin-web/**'
      - 'supabase/functions/platform-admin/**'
      - 'supabase/functions/platform-payment-readiness/**'
      - 'supabase/functions/platform-merchant-message/**'
      - 'supabase/migrations/*platform_admin*'
      - 'supabase/migrations/*platform_merchant_communications*'
      - 'supabase/migrations/*platform_merchant_message*'
      - 'supabase/tests/platform_merchant_message*'
      - '.github/workflows/admin-web-ci.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'apps/admin-web/**'
      - 'supabase/functions/platform-admin/**'
      - 'supabase/functions/platform-payment-readiness/**'
      - 'supabase/functions/platform-merchant-message/**'
      - 'supabase/migrations/*platform_admin*'
      - 'supabase/migrations/*platform_merchant_communications*'
      - 'supabase/migrations/*platform_merchant_message*'
      - 'supabase/tests/platform_merchant_message*'
      - '.github/workflows/admin-web-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package.json

      - name: Install dependencies
        run: npm --prefix . install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Security preflight
        run: npm run preflight

      - name: Admin regression contracts
        run: npm test

      - name: Production build
        run: npm run build
