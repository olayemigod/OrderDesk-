name: Mobile Native CI

concurrency:
  group: mobile-native-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'package.json'
      - 'apps/mobile/modules/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - '.github/workflows/mobile-native-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'apps/mobile/modules/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - '.github/workflows/mobile-native-ci.yml'

jobs:
  android-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm --prefix . ci --no-audit --no-fund

      - name: Generate Android project
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify barcode camera permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          camera_line="$(grep 'android.permission.CAMERA' "$manifest" || true)"
          if [ -z "$camera_line" ]; then
            echo "SellerTray barcode scanner is missing android.permission.CAMERA" >&2
            exit 1
          fi
          if printf '%s\n' "$camera_line" | grep -q 'tools:node="remove"'; then
            echo "SellerTray barcode scanner CAMERA permission is marked for removal" >&2
            exit 1
          fi
          active_audio="$(grep 'android.permission.RECORD_AUDIO' "$manifest" | grep -v 'tools:node="remove"' || true)"
          if [ -n "$active_audio" ]; then
            echo "SellerTray barcode scanning must not request active RECORD_AUDIO permission" >&2
            printf '%s\n' "$active_audio" >&2
            exit 1
          fi

      - name: Verify Kotlin compiler fallback integrity (SDK58 CI only)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/expo-sdk58-dependency-probe-20261108' }}
        env:
          SELLERTRAY_VERIFIED_KOTLIN_REPO: ${{ runner.temp }}/sellertray-kotlin-maven
        run: |
          node --test ../../scripts/qa/kotlin-verified-compiler-mirror.test.mjs
          node ../../scripts/qa/kotlin-verified-compiler-mirror.mjs

      - name: Compile Android Kotlin
        env:
          SELLERTRAY_VERIFIED_KOTLIN_REPO: ${{ runner.temp }}/sellertray-kotlin-maven
        run: |
          chmod +x android/gradlew
          cd android
          if [ "$GITHUB_HEAD_REF" = 'chore/expo-sdk58-dependency-probe-20261108' ]; then
            ./gradlew :app:compileDebugKotlin --init-script ../../../scripts/qa/kotlin-verified-compiler-mirror.init.gradle --no-daemon --stacktrace --max-workers=2
          else
            ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
          fi

      # One bounded SDK58 native release-readiness gate on this review branch.
      # R8 task does not package or sign an APK/AAB; no EAS or provider calls.
      # Keep ordinary Mobile PRs on the original debug Kotlin gate for cost control.
      - name: Verify SDK58 R8 release configuration
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/expo-sdk58-dependency-probe-20261108' }}
        run: |
          grep -qx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties
          grep -Fq 'SellerTrayBluetoothPrinterModule' modules/sellertray-bluetooth-printer/expo-module.config.json
          if grep -R -F 'android.enableMinifyInReleaseBuilds=false' android/gradle.properties android/app/build.gradle; then
            echo 'SDK58 release R8 optimization must not be silently disabled' >&2
            exit 1
          fi

      - name: Check release R8 shrinking without assembling or signing an APK
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/expo-sdk58-dependency-probe-20261108' }}
        run: |
          cd android
          ./gradlew :app:minifyReleaseWithR8 --init-script ../../../scripts/qa/kotlin-verified-compiler-mirror.init.gradle --no-daemon --stacktrace --max-workers=2
          mapping='app/build/outputs/mapping/release/mapping.txt'
          test -s "$mapping"
          if ! grep -Fq 'ng.processedge.sellertray.bluetooth.SellerTrayBluetoothPrinterModule' "$mapping"; then
            echo 'R8 output does not prove SellerTray Bluetooth printer module class retention' >&2
            exit 1
          fi
          if find app/build/outputs/apk app/build/outputs/bundle -type f \
              \( -name '*.apk' -o -name '*.aab' \) 2>/dev/null | grep -q .; then
            echo 'Release R8 verification must not create a distributable APK or AAB' >&2
            exit 1
          fi
          echo 'Release-mode R8 mapping contains local Bluetooth printer module; no APK/AAB generated.'
