name: Mobile Native CI

concurrency:
  group: mobile-native-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'apps/mobile/modules/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - '.github/workflows/mobile-native-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/modules/**'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - '.github/workflows/mobile-native-ci.yml'

jobs:
  android-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compile Android Kotlin
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
