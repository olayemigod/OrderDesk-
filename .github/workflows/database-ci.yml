name: Database CI

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'apps/mobile/src/data/**'
      - 'apps/merchant-web/src/CommercialAgreementsManagement.tsx'
      - '.github/workflows/database-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'apps/mobile/src/data/**'
      - 'apps/merchant-web/src/CommercialAgreementsManagement.tsx'
      - '.github/workflows/database-ci.yml'

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Verify financial document tax rendering contract
        run: node supabase/functions/financial-document/tax-contract.mjs

      - name: Verify tax historical backfill guard contract
        run: node supabase/tests/tax-backfill-generated-line-contract.mjs

      - name: Verify C1B installment webhook retry contract
        run: node supabase/functions/paystack-webhook/c1b-contract.mjs

      - name: Verify C1B installment checkout retry contract
        run: node supabase/functions/billing-checkout/c1b-contract.mjs

      - name: Verify C1B reconciliation recovery contract
        run: node supabase/functions/commercial-agreements/c1b-contract.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

          # The repository checkout directory ends in a hyphen (OrderDesk-).
          # Supabase derives Docker DNS names from project_id, so normalize the
          # local-only CI id to a DNS-safe value.
          sed -i -E 's/^project_id = ".*"$/project_id = "sellertray-ci"/' supabase/config.toml
          grep -q '^project_id = "sellertray-ci"$' supabase/config.toml

      - name: Start database-only Supabase stack
        run: >-
          supabase start --debug
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Replay all migrations
        run: supabase db reset

      - name: Run SellerTray database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
