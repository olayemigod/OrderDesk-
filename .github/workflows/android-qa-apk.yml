name: Android QA APK

on:
  push:
    branches:
      - feat/mvp-foundation
      - feat/sellertray-brand-ui-v1
      - feat/sellertray-mobile-shell-v2
      - feat/sellertray-merchant-web-v1
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-qa-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://eujxswjspolugrzlsjnn.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_NlNRn9grGvfwZ1cYP09OvA_XSHOA-3I
      EXPO_PUBLIC_SELLERTRAY_MOBILE_REDESIGN: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: SellerTray release preflight
        run: npm run preflight

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone QA release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify QA APK identity, signature, and permissions
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -tq "$APK" >/dev/null

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS_DIR"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/aapt"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK"

          EXPECTED_PACKAGE="$(node -p "require('./app.json').expo.android.package")"
          EXPECTED_VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          BADGING="$("$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='${EXPECTED_PACKAGE}'"
          echo "$BADGING" | grep -F "versionCode='${EXPECTED_VERSION_CODE}'"

          PERMISSIONS="$("$BUILD_TOOLS_DIR/aapt" dump permissions "$APK")"
          echo "$PERMISSIONS"
          echo "$PERMISSIONS" | grep -F 'android.permission.BLUETOOTH_CONNECT'

          for forbidden in \
            android.permission.BLUETOOTH_SCAN \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_BACKGROUND_LOCATION; do
            if echo "$PERMISSIONS" | grep -Fq "$forbidden"; then
              echo "Forbidden QA APK permission present: $forbidden" >&2
              exit 1
            fi
          done

      - name: Stage QA APK
        run: |
          mkdir -p qa-artifact
          cp android/app/build/outputs/apk/release/app-release.apk qa-artifact/sellertray-qa.apk
          sha256sum qa-artifact/sellertray-qa.apk > qa-artifact/sellertray-qa.apk.sha256

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: sellertray-qa-${{ github.sha }}
          path: |
            apps/mobile/qa-artifact/sellertray-qa.apk
            apps/mobile/qa-artifact/sellertray-qa.apk.sha256
          if-no-files-found: error
          retention-days: 14