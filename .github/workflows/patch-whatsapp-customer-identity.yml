name: One-shot WhatsApp customer identity convergence

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - .github/workflows/patch-whatsapp-customer-identity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 1
      - name: Replace direct customer creation with governed resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/whatsapp-webhook/index.ts')
          text = path.read_text()
          start = '  const customerPayload: JsonRecord = {'
          end = '  const storedMessages = await rest<Array<{ id: string }>>('

          if text.count(start) != 1:
              raise SystemExit(f'Expected exactly one direct WhatsApp customer payload block, found {text.count(start)}')
          start_index = text.index(start)
          end_index = text.index(end, start_index)

          replacement = '''  const customerId = await rest<string>('/rest/v1/rpc/resolve_sellertray_whatsapp_customer', {
            method: 'POST',
            body: JSON.stringify({
              p_tenant_id: tenantId,
              p_wa_id: event.waId,
              p_display_name: event.customerName,
            }),
          });
          if (!customerId) throw new Error('Unable to resolve WhatsApp customer.');

          '''

          path.write_text(text[:start_index] + replacement + text[end_index:])
          PY

          grep -q "resolve_sellertray_whatsapp_customer" supabase/functions/whatsapp-webhook/index.ts
          if grep -q "const customerPayload: JsonRecord" supabase/functions/whatsapp-webhook/index.ts; then
            echo 'Direct WhatsApp customer creation block still exists.' >&2
            exit 1
          fi
          git diff --check
      - name: Commit governed webhook path
        shell: bash
        run: |
          rm .github/workflows/patch-whatsapp-customer-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/whatsapp-webhook/index.ts .github/workflows/patch-whatsapp-customer-identity.yml
          git commit -m 'fix: unify WhatsApp and POS customer identity'
          git push origin HEAD:feat/sellertray-brand-ui-v1
