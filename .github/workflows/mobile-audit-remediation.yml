name: Mobile Audit Safe Remediation

on:
  push:
    branches:
      - feat/sellertray-merchant-web-v1
    paths:
      - .github/workflows/mobile-audit-remediation.yml
      - apps/mobile/package-lock.json

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sellertray-merchant-web-v1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Apply non-force audit fixes
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          npm audit fix --omit=dev --no-fund
          status=$?
          set -e
          echo "npm audit fix exit status: ${status}"

      - name: Commit lockfile changes
        shell: bash
        run: |
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo "No safe lockfile remediation available."
            exit 0
          fi
          git config user.name "sellertray-agent"
          git config user.email "sellertray-agent@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git commit -m "Apply safe mobile dependency audit fixes"
          git push origin HEAD:feat/sellertray-merchant-web-v1
