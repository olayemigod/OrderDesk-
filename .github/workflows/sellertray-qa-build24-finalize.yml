name: SellerTray Build 24 Finalize

on:
  push:
    branches:
      - feat/sellertray-brand-ui-v1
    paths:
      - 'scripts/finalize-sellertray-qa-build24.mjs'
      - '.github/workflows/sellertray-qa-build24-finalize.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SellerTray QA branch
        uses: actions/checkout@v4
        with:
          ref: feat/sellertray-brand-ui-v1
          fetch-depth: 0

      - name: Apply verified closure changes
        run: node scripts/finalize-sellertray-qa-build24.mjs

      - name: Commit closure changes
        run: |
          if git diff --quiet; then
            echo "No closure changes produced" >&2
            exit 1
          fi
          git config user.name "sellertray-qa-bot"
          git config user.email "sellertray-qa-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fix SellerTray closure loaders and migration history"
          git push origin HEAD:feat/sellertray-brand-ui-v1
